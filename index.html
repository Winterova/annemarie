<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamas Lebensgeschichte</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f1ea; padding: 20px; text-align: center; color: #333; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: 0 auto 20px auto; max-width: 600px; }
    button { font-size: 1.2rem; padding: 15px 25px; border: none; border-radius: 12px; cursor: pointer; margin: 10px; font-weight: bold; }
    .btn-talk { background: #2e7d32; color: white; width: 90%; font-size: 1.6rem; padding: 20px; }
    .btn-camera { background: #0277bd; color: white; width: 90%; }
    .btn-emergency { background: #c62828; color: white; position: fixed; top: 15px; right: 15px; padding: 10px 15px; font-size: 0.9rem; z-index: 100; }
    #status { font-size: 1.2rem; font-weight: bold; color: #555; margin-bottom: 15px; }
    #chat { text-align: left; max-height: 350px; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
    .msg-mutter { color: #1565c0; margin-bottom: 10px; }
    .msg-ki { color: #2e7d32; margin-bottom: 10px; }
  </style>
</head>
<body>

  <button class="btn-emergency" onclick="triggerEmergency()">🚨 Pause / Fertig</button>

  <div class="card">
    <h1>Mamas Lebensgeschichte</h1>
    <div id="status">Bereit für ein Gespräch...</div>
    <button class="btn-talk" onclick="toggleListening()">🎤 Sprechen / Zuhören</button>
  </div>

  <div class="card">
    <h3>Gesprächsverlauf</h3>
    <div id="chat"></div>
  </div>

  <script>
    // DEINE SUPABASE EDGE FUNCTION URL & ANON KEY
    const FUNCTION_URL = "https://fgsprsktzudodqepwmrt.supabase.co/functions/v1/biografie-chat";
    const SUPABASE_ANON_KEY = "DEIN_ANON_PUBLIC_KEY_AUS_SUPABASE";

    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        appendChat("Mutter", text);
        verarbeiteEingabe(text);
      };

      recognition.onerror = () => setStatus("Fehler beim Zuhören. Bitte noch einmal tippen.");
      recognition.onend = () => { isListening = false; };
    } else {
      alert("Spracherkennung wird von diesem Browser leider nicht unterstützt.");
    }

    function toggleListening() {
      if (isListening) {
        recognition.stop();
        isListening = false;
        setStatus("Bereit.");
      } else {
        window.speechSynthesis.cancel();
        recognition.start();
        isListening = true;
        setStatus("Ich höre dir zu...");
      }
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    async function verarbeiteEingabe(userText) {
      setStatus("Denke nach...");

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ userText })
        });

        const data = await response.json();
        
        if(data.aiText) {
          appendChat("Biografin", data.aiText);
          speak(data.aiText);
          setStatus("Bereit.");
        } else {
          setStatus("Fehler bei der Antwort.");
        }

      } catch (err) {
        setStatus("Verbindungsfehler. Bitte nochmal versuchen.");
      }
    }

    function triggerEmergency() {
      window.speechSynthesis.cancel();
      if(recognition) recognition.stop();
      alert("Gespräch pausiert. Alles ist sicher gespeichert!");
      setStatus("Pausiert.");
    }

    function appendChat(sender, text) {
      const chat = document.getElementById("chat");
      const cssClass = sender === "Mutter" ? "msg-mutter" : "msg-ki";
      chat.innerHTML += `<div class="${cssClass}"><strong>${sender}:</strong> ${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }
  </script>
</body>
</html>
