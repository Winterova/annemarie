<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamas Lebensgeschichte</title>
  <!-- Supabase JS Client einbinden -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f1ea; padding: 20px; text-align: center; color: #333; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: 0 auto 20px auto; max-width: 600px; }
    button { font-size: 1.2rem; padding: 15px 25px; border: none; border-radius: 12px; cursor: pointer; margin: 10px; font-weight: bold; }
    .btn-talk { background: #2e7d32; color: white; width: 90%; font-size: 1.6rem; padding: 20px; }
    .btn-camera { background: #0277bd; color: white; width: 90%; }
    .btn-emergency { background: #c62828; color: white; position: fixed; top: 15px; right: 15px; padding: 10px 15px; font-size: 0.9rem; z-index: 100; }
    #status { font-size: 1.2rem; font-weight: bold; color: #555; margin-bottom: 15px; }
    #chat { text-align: left; max-height: 350px; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
    .msg-mutter { color: #1565c0; margin-bottom: 10px; }
    .msg-ki { color: #2e7d32; margin-bottom: 10px; }
  </style>
</head>
<body>

  <button class="btn-emergency" onclick="triggerEmergency()">🚨 Hilfe / Pause</button>

  <div class="card">
    <h1>Mamas Lebensgeschichte</h1>
    <div id="status">Bereit für ein Gespräch...</div>
    <button class="btn-talk" onclick="toggleListening()">🎤 Sprechen / Zuhören</button>
    <br><br>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFoto(event)">
    <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📷 Foto zeigen</button>
  </div>

  <div class="card">
    <h3>Gesprächsverlauf</h3>
    <div id="chat"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // DEINE SCHLÜSSEL HIER EINTRAGEN
    // -------------------------------------------------------------
    const GEMINI_API_KEY = "DEIN_GEMINI_API_KEY"; 
    const SUPABASE_URL = "https://fgsprsktzudodqepwmrt.supabase.co";
    const SUPABASE_ANON_KEY = "DEIN_ANON_PUBLIC_KEY_AUS_SCHRITT_1";
    // -------------------------------------------------------------

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let recognition;
    let isListening = false;

    // Web Speech API Setup
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        appendChat("Mutter", text);
        verarbeiteEingabe(text);
      };

      recognition.onerror = () => setStatus("Fehler beim Zuhören. Bitte noch einmal auf den grünen Button tippen.");
      recognition.onend = () => { isListening = false; };
    } else {
      alert("Spracherkennung wird von diesem Browser leider nicht unterstützt.");
    }

    function toggleListening() {
      if (isListening) {
        recognition.stop();
        isListening = false;
        setStatus("Bereit.");
      } else {
        window.speechSynthesis.cancel(); // Stoppt KI-Stimme, falls sie noch redet
        recognition.start();
        isListening = true;
        setStatus("Ich höre dir zu...");
      }
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 0.95; // Etwas langsamer sprechen
      window.speechSynthesis.speak(utterance);
    }

    async function verarbeiteEingabe(userText) {
      setStatus("Denke nach...");

      const systemPrompt = `Du bist eine einfühlsame, geduldige Biografin.
Sprich ruhig, in kurzen Sätzen (max. 2-3 Sätze). Stelle immer nur EINE Frage.
Deine Gesprächspartnerin spricht Fränkisch. Wenn ein Dialektwort unklar ist, frage sanft nach der Bedeutung und bitten sie, es zu buchstabieren.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              { role: "user", parts: [{ text: systemPrompt + "\n\nAntworte auf diese Aussage der Mutter: " + userText }] }
            ]
          })
        });

        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text;
        
        appendChat("Biografin", aiText);
        speak(aiText);
        setStatus("Bereit.");

        // Fakt in Supabase speichern (Append-Only)
        await supabaseClient.from('biografie_fakten').insert([
          { kategorie: 'Gespräch', aussage: userText }
        ]);

      } catch (err) {
        setStatus("Verbindungsfehler. Versuche es gleich nochmal.");
      }
    }

    function triggerEmergency() {
      window.speechSynthesis.cancel();
      if(recognition) recognition.stop();
      alert("Keine Sorge! Alles wurde sicher gespeichert. Das Gespräch ist pausiert.");
      setStatus("Pausiert.");
    }

    function appendChat(sender, text) {
      const chat = document.getElementById("chat");
      const cssClass = sender === "Mutter" ? "msg-mutter" : "msg-ki";
      chat.innerHTML += `<div class="${cssClass}"><strong>${sender}:</strong> ${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }
  </script>
</body>
</html>
