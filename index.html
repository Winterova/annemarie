<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Lebensgeschichte</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f1ea; padding: 20px; text-align: center; color: #333; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: 0 auto 20px auto; max-width: 600px; }
    button { font-size: 1.2rem; padding: 15px 25px; border: none; border-radius: 12px; cursor: pointer; margin: 10px; font-weight: bold; }
    .btn-talk { background: #2e7d32; color: white; width: 90%; font-size: 1.6rem; padding: 20px; }
    .btn-talk.recording { background: #c62828; animation: pulse 1.5s infinite; }
    .btn-emergency { background: #555; color: white; position: fixed; top: 15px; right: 15px; padding: 10px 15px; font-size: 0.9rem; z-index: 100; }
    #status { font-size: 1.2rem; font-weight: bold; color: #555; margin-bottom: 15px; }
    #live-preview { font-style: italic; color: #888; margin-top: 10px; min-height: 24px; }
    #chat { text-align: left; max-height: 350px; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
    .msg-mutter { color: #1565c0; margin-bottom: 10px; }
    .msg-ki { color: #2e7d32; margin-bottom: 10px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <button class="btn-emergency" onclick="stopAll()">🛑 Abbrechen</button>

  <div class="card">
    <h1>Meine Lebensgeschichte</h1>
    <div id="status">Bereit für ein Gespräch...</div>
    <button id="talkBtn" class="btn-talk" onclick="toggleListening()">🎤 Aufnahme starten</button>
    <div id="live-preview"></div>
  </div>

  <div class="card">
    <h3>Gesprächsverlauf</h3>
    <div id="chat"></div>
  </div>

  <script>
    const FUNCTION_URL = "https://fgsprsktzudodqepwmrt.supabase.co/functions/v1/biografie-chat";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc3Byc2t0enVkb2RxZXB3bXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODgwMTUsImV4cCI6MjEwMjU2NDAxNX0.SizIDBtId7xkhsjdq6nHi73VMquHpbXerF_BKdQ4q5k";

    let recognition;
    let isListening = false;
    let finalTranscript = "";
    let pauseTimer = null;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + " ";
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        
        const currentText = (finalTranscript + interimTranscript).trim();
        document.getElementById("live-preview").innerText = currentText;

        // 4-Sekunden-Timer bei jedem erkannten Wort zurücksetzen & neu starten
        clearTimeout(pauseTimer);
        if (isListening && currentText.length > 0) {
          pauseTimer = setTimeout(() => {
            sendeNachricht();
          }, 4000); // Auto-Absenden nach 4 Sekunden Stille
        }
      };

      recognition.onerror = (e) => console.log("Speech error:", e);
      recognition.onend = () => {
        if (isListening) recognition.start();
      };
    } else {
      alert("Spracherkennung wird nicht unterstützt.");
    }

    function toggleListening() {
      if (!isListening) {
        window.speechSynthesis.cancel();
        finalTranscript = "";
        document.getElementById("live-preview").innerText = "";
        recognition.start();
        isListening = true;
        
        const btn = document.getElementById("talkBtn");
        btn.classList.add("recording");
        btn.innerText = "⏹️ Fertig / Abschicken";
        setStatus("Ich höre zu... Sprich ganz in Ruhe.");
      } else {
        sendeNachricht();
      }
    }

    function sendeNachricht() {
      clearTimeout(pauseTimer);
      if (!isListening) return;

      isListening = false;
      recognition.stop();
      
      const btn = document.getElementById("talkBtn");
      btn.classList.remove("recording");
      btn.innerText = "🎤 Aufnahme starten";

      setTimeout(() => {
        const textToSend = finalTranscript.trim();
        document.getElementById("live-preview").innerText = "";
        if (textToSend.length > 0) {
          appendChat("Mutter", textToSend);
          verarbeiteEingabe(textToSend);
        } else {
          setStatus("Keine Sprache erkannt. Bitte nochmal versuchen.");
        }
      }, 400);
    }

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  
  // Laufende Sprachausgaben sofort stoppen
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE';
  utterance.rate = 0.92; // Etwas langsamer für bessere Verständlichkeit
  utterance.pitch = 1.0;

  // Verfügbare Stimmen abrufen
  const voices = window.speechSynthesis.getVoices();

  // Prioritätenliste für natürlich klingende Stimmen
  const preferredVoice = voices.find(v => 
    v.lang.startsWith('de') && (
      v.name.includes('Google') || 
      v.name.includes('Natural') || 
      v.name.includes('Premium') ||
      v.name.includes('Katja') ||
      v.name.includes('Marlene')
    )
  ) || voices.find(v => v.lang.startsWith('de'));

  if (preferredVoice) {
    utterance.voice = preferredVoice;
  }

  window.speechSynthesis.speak(utterance);
}

// Sicherstellen, dass die Stimmen im Browser geladen sind
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

    async function verarbeiteEingabe(userText) {
      setStatus("Denke nach...");

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ userText })
        });

        const data = await response.json();

        if (response.ok && data.aiText) {
          appendChat("Biografin", data.aiText);
          speak(data.aiText);
          setStatus("Bereit für die nächste Antwort.");
        } else {
          console.error("Server-Fehler:", data);
          setStatus("Fehler bei der Antwort: " + (data.error || "Unbekannter Fehler"));
        }

      } catch (err) {
        setStatus("Verbindungsfehler. Bitte erneut versuchen.");
      }
    }

    function stopAll() {
      clearTimeout(pauseTimer);
      window.speechSynthesis.cancel();
      if (recognition) {
        isListening = false;
        recognition.stop();
      }
      document.getElementById("talkBtn").classList.remove("recording");
      document.getElementById("talkBtn").innerText = "🎤 Aufnahme starten";
      setStatus("Pausiert.");
    }

    function appendChat(sender, text) {
      const chat = document.getElementById("chat");
      const cssClass = sender === "Mutter" ? "msg-mutter" : "msg-ki";
      chat.innerHTML += `<div class="${cssClass}"><strong>${sender}:</strong> ${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }
  </script>
</body>
</html>
